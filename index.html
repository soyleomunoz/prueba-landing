<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de publicación · GestixPro</title>
<style>
  :root{--bg:#0b1220;--card:#111a2e;--txt:#e6edf7;--muted:#8fa3bf;--acc:#22d3ee}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .card{background:var(--card);border:1px solid #1e2a44;border-radius:16px;padding:32px;max-width:440px;text-align:center}
  h1{font-size:1.5rem;margin-bottom:8px}
  p{color:var(--muted);line-height:1.6}
  .ok{display:inline-block;margin-bottom:16px;padding:6px 14px;border-radius:999px;background:rgba(34,211,238,.12);color:var(--acc);font-weight:600;font-size:.85rem}
  footer{margin-top:20px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
  <main class="card">
    <span class="ok">✓ Publicación automática OK</span>
    <h1>Prueba de GitHub Pages</h1>
    <p>Esta página fue publicada desde Claude, sin usar el computador.</p>
    <footer>Desarrollado por GestixPro · <span id="y"></span></footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
